<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0205;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }

        /* Question Screen (Yes / No) */
        .question-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            gap: 30px;
        }

        .question-title {
            font-size: 2rem;
            color: #ff4081;
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.6);
        }

        .btn-group {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        .btn-yes {
            background-color: #ff2e63;
            color: white;
            box-shadow: 0 0 15px rgba(255, 46, 99, 0.5);
        }

        .btn-no {
            background-color: #333333;
            color: #aaaaaa;
        }

        /* Main Game Area */
        .main-game {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #d1829e;
            font-style: italic;
            letter-spacing: 1px;
            opacity: 0.8;
            transition: all 0.5s ease;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: all 0.5s ease;
        }

        /* Heart & Archery Stage */
        .stage {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ff6b8b, #d81b60);
            transform: rotate(-45deg);
            box-shadow: 0 0 30px rgba(216, 27, 96, 0.8);
            border-radius: 10px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            top: 70px;
        }

        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 70px;
            height: 70px;
            background: inherit;
            border-radius: 50%;
        }

        .heart::before { top: -35px; left: 0; }
        .heart::after { left: 35px; top: 0; }

        .archery-svg {
            position: absolute;
            bottom: 20px;
            width: 80px;
            height: 80px;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Tree Canvas */
        #treeCanvas {
            display: none;
            width: 320px;
            height: 320px;
        }

        /* Final Photo Section */
        .photo-wrapper {
            display: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s ease;
            margin-top: -30px;
        }

        .photo-wrapper.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .love-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4081;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.6);
        }

        .click-hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="question-screen" id="questionScreen">
            <h2 class="question-title" id="questionTitle"></h2>
            <div class="btn-group">
                <button class="btn btn-yes" id="btnYes" onclick="startInteractiveFlow()"></button>
                <button class="btn btn-no" id="btnNo" onclick="shrinkNoButton()"></button>
            </div>
        </div>

        <div class="main-game" id="mainGame" onclick="nextStep()">
            <div>
                <div class="subtitle" id="subtitle"></div>
                <div class="main-title" id="title"></div>
            </div>

            <div class="stage" id="stage">
                <div class="heart" id="heart"></div>
                <svg class="archery-svg" id="arrowSvg" viewBox="0 0 100 100">
                    <path d="M 20 80 Q 50 100 80 80" stroke="#d1829e" stroke-width="3" fill="none"/>
                    <line x1="20" y1="80" x2="80" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
                    <line x1="50" y1="80" x2="50" y2="30" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="50,20 45,32 55,32" fill="#ffffff"/>
                </svg>
            </div>

            <canvas id="treeCanvas" width="320" height="320"></canvas>

            <div class="photo-wrapper" id="photoBox">
                <img id="loveImg" src="" alt="Love Photo" class="love-img">
            </div>

            <div class="click-hint" id="hint"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
